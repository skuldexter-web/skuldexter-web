name: Generate Snake

on:
  # Automatisch elke 24 uur uitvoeren
  schedule:
    - cron: "0 */24 * * *"
  
  # Toestaat om handmatig te starten via het tabblad Actions
  workflow_dispatch:
  
  # Uitvoeren bij elke push naar de main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Genereert de snake animatie op basis van de bijdragen van skuldexter-web
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: skuldexter-web
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Pusht de gegenereerde SVG naar de 'output' branch zodat de README hem kan vinden
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
